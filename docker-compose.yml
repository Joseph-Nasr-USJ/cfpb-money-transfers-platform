# Banking Complaints Data Platform - local stack.
# Start: docker compose up -d      Stop: docker compose down      Reset (deletes data): docker compose down -v
# All settings and secrets come from .env (copy .env.example to .env first).

name: cfpb

# The pipeline image is shared by the pipeline and minio-init services.
x-pipeline-build: &pipeline-build
  context: .
  dockerfile: docker/pipeline.Dockerfile

services:

  # Object storage for the raw, curated, quarantine and quality zones (bucket cfpb-lake).
  # MinIO stopped publishing official images in October 2025. This is a community rebuild of the
  # last MinIO release, pinned to its exact tag. Ports are bound to 127.0.0.1 (this machine only).
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"   # run as root: the image's default user cannot write to the Docker volume
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: .env
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: creates bucket cfpb-lake if it does not exist yet, then exits.
  minio-init:
    build: *pipeline-build
    image: cfpb-pipeline:dev
    env_file: .env
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "docker/minio_init.py"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Serving layer: curated complaints and aggregates for the dashboard.
  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Apache NiFi: scheduled collection of the CFPB CSV and API into MinIO, with provenance (Session 2).
  # Web UI: https://localhost:8443/nifi (self-signed certificate; login NIFI_USERNAME / NIFI_PASSWORD from .env,
  # password at least 12 characters, otherwise NiFi generates random credentials and prints them in its log).
  # The exported flow lives in ingestion/nifi/ and is visible inside the container under project-flows/.
  nifi:
    image: apache/nifi:2.12.0
    env_file: .env   # MinIO and CFPB settings, readable from NiFi Expression Language as environment variables
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-}
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_PROXY_HOST: "localhost:8443,127.0.0.1:8443"
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./ingestion/nifi:/opt/nifi/nifi-current/project-flows:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$$(hostname)/8443' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Python 3.11 + Java 17 + PySpark: Spark job, MongoDB loader, processing chain and the Python fallback collectors.
  # The repository is mounted at /app, so code changes do not need an image rebuild.
  pipeline:
    build: *pipeline-build
    image: cfpb-pipeline:dev
    env_file: .env
    working_dir: /app
    volumes:
      - .:/app
    command: ["python", "-m", "ingestion.scheduler"]
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    restart: on-failure:5

  # Redis: in-memory cache for dashboard query results (cache-aside with a time-to-live, Session 4.1).
  # Cache only: no persistence, at most 256 MB, least recently used keys evicted first.
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Streamlit dashboard (reads MongoDB only, through the Redis cache).
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio_data:
  mongo_data:
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
